<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #ffa116;
    }
    label {
      font-size: 12px;
      color: #cccccc;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 90%;
      padding: 8px;
      border: 1px solid #3e3e3e;
      border-radius: 4px;
      background-color: #282828;
      color: #ffffff;
      font-size: 12px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #ffa116;
      color: #000000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #e08e12;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #4caf50;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>⚡ Student Buddy Settings</h3>
  <label for="apiKey">OpenAI API Key:</label>
  <input type="password" id="apiKey" placeholder="sk-proj-..." />
  <button id="saveBtn">Save API Key</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
